<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xEnglish Options</title>
    <link rel="stylesheet" href="../src/styles/options.css" />
  </head>
  <body>
    <main class="card">
      <h1>xEnglish 設定</h1>
      <p>OpenAI APIキーと使用モデルを設定します。</p>

      <label for="apiKey">OpenAI API Key</label>
      <input id="apiKey" type="password" placeholder="sk-..." />

      <label for="model">Model</label>
      <input id="model" type="text" placeholder="gpt-4.1-mini" />

      <button id="saveButton" type="button">保存</button>
      <div id="status"></div>
      <p class="help">
        APIキーはローカルの拡張機能ストレージに保存されます。
        <a href="https://platform.openai.com/api-keys" target="_blank" rel="noreferrer">APIキーを作成する</a>
      </p>
    </main>
    <script type="module" src="../src/options-page.ts"></script>
  </body>
</html>
