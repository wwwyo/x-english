<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XEnglish 設定</title>
    <link rel="stylesheet" href="../src/styles/popup.css" />
  </head>
  <body>
    <main class="card">
      <h1>XEnglish 設定</h1>
      <p>
        デフォルトでは XEnglish のシステムプロバイダキーを利用します（1日50件まで）。
        上限超過後はBYOKを設定すると継続利用できます。
      </p>

      <label for="apiKey">BYOK: OpenAI API Key（任意）</label>
      <input id="apiKey" type="password" placeholder="sk-..." />

      <label for="model">Model</label>
      <input id="model" type="text" placeholder="gpt-4.1-mini" />

      <label for="workerBaseUrl">XEnglish Worker Base URL</label>
      <input
        id="workerBaseUrl"
        type="text"
        placeholder="https://xenglish-api.example.workers.dev"
      />

      <button id="saveButton" type="button">保存</button>
      <div id="status"></div>
      <p class="help">
        BYOKのAPIキーはローカルの拡張機能ストレージに保存されます。
        <span class="warning">クライアント保存はセキュリティ上非推奨です。</span>
        <a href="https://platform.openai.com/api-keys" target="_blank" rel="noreferrer"
          >APIキーを作成する</a
        >
      </p>
    </main>
    <script type="module" src="../src/popup-page.ts"></script>
  </body>
</html>
